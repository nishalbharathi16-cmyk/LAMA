<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="340" height="230" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .lama-stacked-wordmark {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 0.22em;
        fill: #F2EDE3;
        text-anchor: middle;
      }
      .lama-stacked-tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 8.6px;
        font-weight: 600;
        letter-spacing: 0.24em;
        fill: #C8BFB0;
        text-transform: uppercase;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Centered Monogram Mark (Scale 1.25) -->
  <g transform="translate(120, 16) scale(1.25)">
    
    <!-- LAMA Monogram: Architectural L with 3 Ascending Steps -->
    <g class="lama-monogram" id="lama-monogram-dark">
      <!-- Vertical Spine (Authority Pillar) -->
      <path d="M 14 14.5 L 14 63 L 26 63 L 26 14.5 Z" fill="#F2EDE3" />
      
      <!-- Crown Capstone on Vertical Spine -->
      <path d="M 14 10 L 26 10 L 26 13.5 L 14 13.5 Z" fill="#B69A6A" />

      <!-- Horizontal Base Plinth (Foundation Ground) -->
      <path d="M 14 64 L 67 64 L 67 71 L 14 71 Z" fill="#F2EDE3" />

      <!-- Ascending Architectural Step 1 (Entry / Foundation) -->
      <path d="M 28.5 47 L 39 47 L 39 63 L 28.5 63 Z" fill="#9AA08F" />

      <!-- Ascending Architectural Step 2 (Managerial Acceleration) -->
      <path d="M 41.5 35 L 52 35 L 52 63 L 41.5 63 Z" fill="#B96543" />

      <!-- Ascending Architectural Step 3 (Executive Summit) -->
      <path d="M 54.5 23 L 65 23 L 65 63 L 54.5 63 Z" fill="#B69A6A" />
    </g>
    
  </g>

  <!-- Wordmark LAMA -->
  <text x="170" y="148" class="lama-stacked-wordmark">LAMA</text>

  <!-- Architectural Accent Bar in Burnt Terracotta -->
  <line x1="140" y1="162" x2="200" y2="162" stroke="#B96543" stroke-width="2" />

  <!-- Tagline -->
  <text x="170" y="184" class="lama-stacked-tagline">LEADERSHIP &amp; MANAGERIAL SKILLS ACADEMY</text>
</svg>
